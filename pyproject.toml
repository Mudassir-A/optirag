[project]
name = "optirag"
version = "0.1.0"
description = "RAG service with semantic caching, cost-aware routing and escalation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.0",
    "fastapi>=0.115",
    "litellm>=1.50",
    "numpy>=2.0",
    "pandas>=2.2",
    "pydantic>=2.8",
    "pypdf>=5.0",
    "python-dotenv>=1.0",
    "sentence-transformers>=3.0",
    "streamlit>=1.38",
    "tqdm>=4.66",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
optirag = "optirag:main"

[dependency-groups]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.6"]
notebooks = [
    "ipykernel>=6.29",
    "ipywidgets>=8.1",
    "jupyterlab>=4.2",
    "langchain>=0.3",
    "langchain-chroma>=0.1",
    "langchain-community>=0.3",
    "langchain-groq>=0.2",
    "langchain-huggingface>=0.1",
    "langchain-text-splitters>=0.3",
    "langgraph>=0.2",
]

[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"
